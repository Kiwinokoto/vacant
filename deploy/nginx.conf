# VACANT isolated static service (Nginx). No proxy changes or data access.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression HTTP only: underlying SHA-pinned GeoJSON bytes stay unchanged.
    # Nginx checks Accept-Encoding and sends Vary for shared caches.
    gzip on;
    gzip_vary on;
    # With a Via header (reverse proxy), nginx defaults to NOT compressing.
    # VACANT serves only static public files; allow gzip even via the proxy.
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/geo+json application/json;

    location / {
        try_files $uri $uri/ =404;
    }
    # Nginx stable image may not know .mjs; browsers require module MIME.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ \.geojson$ {
        types { application/geo+json geojson; }
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
