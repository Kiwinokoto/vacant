# VACANT isolated static service (Nginx). No proxy changes or data access.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # Nginx stable image may not know .mjs; browsers require module MIME.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ \.geojson$ {
        types { application/geo+json geojson; }
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
